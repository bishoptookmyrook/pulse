<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .sticky-note {
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            transform: rotate(-2deg);
        }
        
        .sticky-note:nth-child(2n) {
            transform: rotate(2deg);
        }
        
        .sticky-note:nth-child(3n) {
            transform: rotate(-1deg);
        }
        
        .color-1 { background-color: #FFE4B5; }
        .color-2 { background-color: #FFB6C1; }
        .color-3 { background-color: #B0E0E6; }
        .color-4 { background-color: #98FB98; }
        .color-5 { background-color: #DDA0DD; }
        .color-6 { background-color: #F0E68C; }
        
        .form-section {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 8px;
        }
        
        .form-section a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 30px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .form-section a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PULSE</h1>
        <div id="board" class="board"></div>
        <div class="form-section">
            <p>Add your post</p>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeZ8k4KZPc-_dIpHvdgE5tvXzER9TnOyZrSIm7SEY1czF866A/viewform?usp=sharing&ouid=116121766711872800302" target="_blank">Share what's on your mind</a>
        </div>
    </div>

    <script>
        // YOUR SHEET ID HERE - Replace with your actual Sheet ID
       // Replace with your published CSV link from Step 1
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRI7vOPks6X2j02rFafvO5XJDxIlJx5uHNxY1iItDycxisdamNEEEQNqLAsEfCR9EnXwePPk2tPT6lt/pub?output=csv';
    
    async function fetchPosts() {
        try {
            const response = await fetch(CSV_URL);
            const text = await response.text();
            const rows = text.split('\n');
            
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            // Start from row 1 (skip header)
            for (let i = 1; i < rows.length; i++) {
                const cells = rows[i].split(',');
                const post = cells[1]; // Column B (the post)
                
                if (post && post.trim()) {
                    const note = document.createElement('div');
                    note.className = `sticky-note color-${(i % 6) + 1}`;
                    note.textContent = post.replace(/"/g, '');
                    board.appendChild(note);
                }
            }
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    }
    
    fetchPosts();
    setInterval(fetchPosts, 10000);
    </script>
</body>
</html>
